services:
  db: 
    image: postgres:16
    container_name: precip-pg
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: precipitation
    ports:
      - "5432:5432"
    volumes:
      - precip-pg-data:/var/lib/postgresql/data

volumes: 
  precip-pg-data: